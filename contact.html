    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">
    <a href="index.html">Bapir <span>Productions</span></a>
</div>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="portfolio.html">Portfolio</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <section class="content-page">
        <div class="container">
            <h1>Contact Us</h1>
            <p>Have a project in mind? Let's bring your vision to life. Fill out the form below and we'll get back to you shortly.</p>
            
            <div class="contact-form">
                <form id="contactForm" action="https://formspree.io/f/mykleojk" method="POST">
                    <div class="form-group">
                        <label for="name">Your Name:</label>
                        <input type="text" name="name" id="name" placeholder="John Doe" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Your Email:</label>
                        <input type="email" name="email" id="email" placeholder="email@example.com" required>
                    </div>

                    <div class="form-group">
                        <label for="message">Your Message:</label>
                        <textarea name="message" id="message" rows="5" placeholder="Tell us about your project..." required></textarea>
                    </div>

                    <button type="submit" class="btn" data-fs-submit-btn>Send Message</button>
                    
                    <div id="formStatus"></div>
                </form>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 Bapir Productions. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
