<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Bapir Productions</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">Bapir <span>Productions</span></div>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="portfolio.html">Portfolio</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <section class="content-page">
        <div class="container">
            <h1>Get In Touch</h1>
            <p>Have a project in mind? Let's collaborate and make it happen.</p>
            
            <div data-fs-success style="display:none; color: var(--primary-green); margin-bottom: 20px; font-weight: bold;">
                Thanks! Your message has been sent successfully.
            </div>
            <div data-fs-error style="display:none; color: red; margin-bottom: 20px; font-weight: bold;">
                Oops! There was a problem submitting your form.
            </div>

            <form id="contactForm" class="contact-form" data-fs-form>
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter your name" required data-fs-field>
                    <span data-fs-error="name" style="color: red; font-size: 0.8rem;"></span>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required data-fs-field>
                    <span data-fs-error="email" style="color: red; font-size: 0.8rem;"></span>
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" placeholder="Tell us about your project" required data-fs-field></textarea>
                    <span data-fs-error="message" style="color: red; font-size: 0.8rem;"></span>
                </div>
                <button type="submit" class="btn" data-fs-submit-btn>Send Message</button>
            </form>
        </div>
    </section>

    <script src="https://formspree.io/f/mykleojk" defer></script>
    <script src="script.js"></script>

    <footer>
        <p>&copy; 2026 Bapir Productions. All rights reserved.</p>
    </footer>
</body>
</html>
